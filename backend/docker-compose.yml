# Local development database only. Production uses managed Postgres
# (Neon/Railway) via DATABASE_URL — see docs/architecture.md.
services:
  db:
    image: postgres:16
    container_name: music-app-db
    environment:
      POSTGRES_DB: studies
      POSTGRES_USER: studies
      POSTGRES_PASSWORD: studies
    # Host port 5433 (not 5432) so this container doesn't collide with a
    # natively-installed Postgres that may already own 5432. The container still
    # listens on 5432 internally; DATABASE_URL points at localhost:5433.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studies -d studies"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

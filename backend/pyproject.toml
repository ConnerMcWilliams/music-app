[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-app-backend"
version = "0.0.0"
description = "Django backend for the Clarke trumpet studies app."
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0,<5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.4",
    "dj-database-url>=2.1",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    # DSP for the grading engine (grading/engine): framed RMS, FFT
    # autocorrelation pitch tracking, spectral-flux onsets. NumPy only — no
    # heavy audio stack. Compressed-audio decoding is optional (see [audio]).
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]
# Optional: decode compressed device recordings (m4a/aac/mp3) without a system
# FFmpeg install — PyAV's wheels bundle FFmpeg. WAV uploads work without this.
audio = [
    "av>=12.0",
]

[tool.setuptools]
# The Django project (`config`) and each Django app are top-level packages.
packages = ["config", "studies", "users", "grading"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["config", "studies", "users"]

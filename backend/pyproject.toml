[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-app-backend"
version = "0.0.0"
description = "Django backend for the Clarke trumpet studies app."
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0,<5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.4",
    "dj-database-url>=2.1",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    # DSP for the grading engine (grading/engine): framed RMS, FFT
    # autocorrelation pitch tracking, spectral-flux onsets.
    "numpy>=1.26",
    # Decode compressed device recordings (m4a/aac/mp3) for grading. PyAV's
    # wheels bundle FFmpeg, so m4a grades fully with no system install. WAV also
    # decodes via the stdlib, and a system `ffmpeg` on PATH is used as a fallback.
    "av>=12.0",
    # Verify Google Sign-In ID tokens server-side (signature via Google's JWKS,
    # expiry, issuer). The `requests` extra provides the JWKS fetch transport.
    "google-auth[requests]>=2.38",
    # Production WSGI server. `gunicorn config.wsgi` serves the app behind the
    # host's TLS proxy (see railway.json).
    "gunicorn>=22.0",
    # Serve collected static (Django admin + DRF browsable API assets) straight
    # from the app process, so no separate static host/CDN is needed. Wired into
    # MIDDLEWARE and STORAGES in config/settings.py.
    "whitenoise>=6.7",
    # Send transactional mail via Resend's HTTPS API. Railway blocks outbound
    # SMTP (ports 465/587/2525) on non-Pro plans, so smtp sends fail with
    # "Network is unreachable"; Anymail's Resend backend uses HTTPS/443 instead
    # and is a drop-in Django email backend. The base package is enough for
    # sending (the [resend] extra only adds webhook-signature deps we don't use).
    "django-anymail>=15,<16",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[tool.setuptools]
# The Django project (`config`) and each Django app are top-level packages.
packages = ["config", "studies", "users", "grading", "progress", "waitlist", "contact", "dashboard", "updates", "analytics", "features"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["config", "studies", "users", "grading", "progress", "waitlist", "contact", "dashboard", "updates", "analytics", "features"]

name: CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    # Postgres matches production (managed Postgres); tests run against it rather
    # than SQLite to avoid dialect drift.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: studies
          POSTGRES_USER: studies
          POSTGRES_PASSWORD: studies
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studies -d studies"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-not-for-production
      DEBUG: "0"
      DATABASE_URL: postgres://studies:studies@localhost:5432/studies

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2

  # Mobile checks live in .github/workflows/mobile-ci.yml (lint, types, tests,
  # and an Expo config + export smoke test). Kept separate to avoid duplicate
  # runs and so each side only runs when its own paths change.

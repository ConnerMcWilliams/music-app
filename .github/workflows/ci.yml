name: CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      SECRET_KEY: ci-secret-not-for-production
      DEBUG: "0"
      DATABASE_URL: postgres://studies:studies@localhost:5432/studies

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Postgres matches production (managed Postgres); tests run against it
      # rather than SQLite to avoid dialect drift.
      #
      # It runs as a plain container rather than a `services:` block on purpose.
      # Service-container images are pulled before any step runs, so that pull
      # cannot be retried, redirected, or diagnosed from the workflow — a Docker
      # Hub blip fails the job before checkout (see run 30182954087). Starting it
      # from a step buys us a mirror, real retries, and readable errors.
      - name: Start Postgres
        run: |
          set -euo pipefail

          # ECR Public mirrors the Docker official images and is not subject to
          # Docker Hub's per-IP anonymous pull limits, which shared Actions
          # runners routinely exhaust. Docker Hub stays as a fallback so a
          # single registry outage can no longer red the build.
          refs=(
            "public.ecr.aws/docker/library/postgres:16"
            "postgres:16"
          )

          image=""
          for ref in "${refs[@]}"; do
            for attempt in 1 2 3; do
              echo "::group::Pulling $ref (attempt $attempt/3)"
              if docker pull "$ref"; then
                echo "::endgroup::"
                image="$ref"
                break 2
              fi
              echo "::endgroup::"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            echo "::warning::Could not pull $ref"
          done

          if [ -z "$image" ]; then
            echo "::error::Could not pull the Postgres image from any registry"
            exit 1
          fi

          docker run --detach --name ci-postgres \
            --env POSTGRES_DB=studies \
            --env POSTGRES_USER=studies \
            --env POSTGRES_PASSWORD=studies \
            --publish 5432:5432 \
            "$image"

          echo "Waiting for Postgres to accept connections..."
          for _ in $(seq 1 60); do
            if docker exec ci-postgres pg_isready -U studies -d studies >/dev/null 2>&1; then
              echo "Postgres is ready (from $image)."
              exit 0
            fi
            sleep 2
          done

          echo "::error::Postgres did not become ready within 120s"
          docker logs ci-postgres
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2

  # Mobile checks live in .github/workflows/mobile-ci.yml (lint, types, tests,
  # and an Expo config + export smoke test). Kept separate to avoid duplicate
  # runs and so each side only runs when its own paths change.

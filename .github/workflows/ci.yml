name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
        run:
            working-directory: backend

    # `manage.py test` always builds a test database, and settings default to
    # Postgres, so CI needs a running Postgres. Credentials/db match the
    # DATABASE_URL default in config/settings.py.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studies
          POSTGRES_PASSWORD: studies
          POSTGRES_DB: studies
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          DATABASE_URL: postgres://studies:studies@localhost:5432/studies
        run: |
          python manage.py test

  # Mobile checks now live in .github/workflows/mobile-ci.yml (lint, types,
  # tests, and an Expo config + export smoke test). Kept out of this workflow
  # to avoid duplicate runs.